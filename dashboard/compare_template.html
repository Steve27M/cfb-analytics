<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIDIRONIQ — Team Comparison</title>
<meta name="description" content="Compare any two FBS teams — the 2025 season (SP+, EPA, efficiency, player leaders) or the live 2026 season to date (record, in-season rating, projections, schedule) — with a neutral-field matchup projection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Saira+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#06070a;color:#f3f6fb;font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  select{-webkit-appearance:none;appearance:none;cursor:pointer;outline:none;}
  select option{color:#111;background:#fff;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:#0c0e13;}
  ::-webkit-scrollbar-thumb{background:#242833;border-radius:6px;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 26px;}
  .sec{display:flex;align-items:center;gap:12px;margin:34px 0 14px;}
  .sec h2{font:400 22px 'Anton';letter-spacing:.02em;text-transform:uppercase;margin:0;}
  .sec .line{flex:1;height:1px;background:var(--border);}
  .sec .hint{font:600 11px 'Space Grotesk';letter-spacing:.14em;color:var(--sub);}
  .panel{border-radius:16px;border:1px solid var(--border);background:var(--panel);}
  .crest{flex-shrink:0;border-radius:15px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.45);overflow:hidden;}
  .crest img{width:78%;height:78%;object-fit:contain;}
  @media(max-width:820px){
    .hero,.kpis,.trio,.players{grid-template-columns:1fr !important;}
    .kpis{grid-template-columns:1fr 1fr !important;}
  }
  @keyframes cfbrise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  /* pickers */
  .pickers{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pickers input{font:500 13px 'Space Grotesk';padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none;width:150px;}
  .pickers input::placeholder{color:var(--sub);}
  .pickers select{font:600 13px 'Space Grotesk';padding:9px 12px;border-radius:9px;color:var(--text);max-width:260px;}
  .pickers select.conf{border:1px solid var(--border);background:var(--panel2);color:var(--sub);}
  .pickers .swap{font:700 15px 'Space Grotesk';width:34px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--sub);cursor:pointer;}
  .pickers .swap:hover{color:var(--text);border-color:var(--sub);}
  .tog{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);}
  .tog button{font:600 12px 'Space Grotesk';padding:8px 14px;border-radius:8px;border:none;cursor:pointer;background:transparent;color:var(--sub);}
  .tog button.on{font-weight:700;background:var(--a);color:var(--aText);}
  .tog button:disabled{cursor:not-allowed;opacity:.55;}
  .sched{display:flex;flex-direction:column;}
  .sched .row{display:grid;grid-template-columns:34px 46px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font:500 12.5px 'Space Grotesk';}
  .sched .row .wk{font:600 10px 'JetBrains Mono';color:var(--sub);}
  .sched .row .dt{font:500 11px 'JetBrains Mono';color:var(--sub);}
  .sched .row .opp{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sched .row .opp .site{color:var(--sub);font-weight:400;}
  .sched .res{font:700 12px 'JetBrains Mono';padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .sched .res.w{background:var(--good);color:#04120a;} .sched .res.l{background:#ff6b6b;color:#fff;}
  .sched .res.p{background:var(--panel2);border:1px solid var(--border);color:var(--sub);}
  .sched .res.g{background:var(--panel2);border:1px solid var(--border);color:#ffd166;}
  .meet{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font:500 12.5px/1.5 'Space Grotesk';color:var(--sub);}
  .meet b{color:var(--text);font-weight:600;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DATA = __CFB_DATA__;

/* ---------- color helpers (ported from the wireframe) ---------- */
function lum(hex){ try{ const c=hex.replace('#','');
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)/255; }catch(e){ return .5; } }
function txtOn(hex){ return lum(hex)>0.6 ? '#0c0d11' : '#ffffff'; }
function accent(t){ let a=t.primary; if(lum(a)<0.17){ a=(t.secondary&&lum(t.secondary)>0.2)?t.secondary:'#d7dee8'; } return a; }
const GOOD='#3ddc84', BAD='#ff6b6b';

/* ---------- normal CDF for the win-prob mapping ---------- */
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }

/* ---------- crest = team-coloured badge holding the real logo ---------- */
function crest(t,size){
  const acc=accent(t);
  return `<div class="crest" style="width:${size}px;height:${size*1.1}px;
    background:linear-gradient(150deg, ${t.primary} 0%, color-mix(in srgb, ${t.primary} 55%, #06070a) 100%);
    border-color:${acc};">
    <img src="${t.logo}" alt="${t.name} logo" loading="lazy"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${t.abbr}',style:'font:800 ${size*0.3}px \\'Saira Condensed\\';color:${txtOn(t.primary)}'}))">
  </div>`;
}

/* ---------- charts (SVG strings) ---------- */
function radar(A,B,accA,accB){
  const S=210,c=S/2,R=68, keys=['off','def','st','exp','eff','tal'], labs=['OFF','DEF','ST','EXP','EFF','TAL'];
  const grid='rgba(255,255,255,.09)', sub='#8a96a8';
  const pt=(i,r)=>{const a=(-90+i*60)*Math.PI/180;return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  const poly=(t)=>keys.map((k,i)=>pt(i,R*(t.radar[k]||0)/100).join(',')).join(' ');
  let rings=[0.33,0.66,1].map(f=>`<polygon points="${keys.map((k,j)=>pt(j,R*f).join(',')).join(' ')}" fill="none" stroke="${grid}" stroke-width="1"/>`).join('');
  let axes=keys.map((k,i)=>{const[x,y]=pt(i,R);return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;}).join('');
  let labels=labs.map((L,i)=>{const[x,y]=pt(i,R+14);return `<text x="${x}" y="${y}" fill="${sub}" font-size="10" font-weight="600" font-family="Space Grotesk" text-anchor="middle" dominant-baseline="middle">${L}</text>`;}).join('');
  let dots=keys.map((k,i)=>{const[x,y]=pt(i,R*(A.radar[k]||0)/100);return `<circle cx="${x}" cy="${y}" r="3" fill="${accA}"/>`;}).join('');
  return `<svg viewBox="0 0 ${S} ${S}" style="width:100%;max-width:220px;display:block;margin:4px auto 0;">
    ${rings}${axes}${labels}
    <polygon points="${poly(B)}" fill="${accB}" fill-opacity=".14" stroke="${accB}" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="${poly(A)}" fill="${accA}" fill-opacity=".28" stroke="${accA}" stroke-width="2.5"/>${dots}</svg>`;
}
function gauge(vA,vB,accA,accB,label){                  // projected wins (of ~13)
  const W=220,H=130,cx=W/2,cy=112,r=84, track='rgba(255,255,255,.08)', text='#f3f6fb', sub='#8a96a8', panel='#12151d';
  const pa=Math.max(0,Math.min(1,(vA||0)/13)), pb=Math.max(0,Math.min(1,(vB||0)/13));
  const pol=(deg)=>{const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const arc=(a0,a1)=>{const[x0,y0]=pol(a0),[x1,y1]=pol(a1);const big=(a1-a0)>180?1:0;return `M ${x0} ${y0} A ${r} ${r} 0 ${big} 1 ${x1} ${y1}`;};
  const [bx,by]=pol(180+180*pb);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:230px;display:block;margin:0 auto;">
    <path d="${arc(180,360)}" fill="none" stroke="${track}" stroke-width="14" stroke-linecap="round"/>
    <path d="${arc(180,180+180*pa)}" fill="none" stroke="${accA}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="${bx}" cy="${by}" r="6" fill="${panel}" stroke="${accB}" stroke-width="3"/>
    <text x="${cx}" y="${cy-16}" fill="${text}" font-size="40" font-weight="800" font-family="Saira Condensed" text-anchor="middle">${vA!=null?vA.toFixed(1):'—'}</text>
    <text x="${cx}" y="${cy+2}" fill="${sub}" font-size="10" font-weight="600" font-family="Space Grotesk" letter-spacing=".12em" text-anchor="middle">${label}</text></svg>`;
}
function trend(a,b,accA,accB){
  const W=1120,H=230,padL=30,padR=14,padT=16,padB=26, grid='rgba(255,255,255,.09)', sub='#8a96a8', panel='#12151d';
  const all=a.concat(b);
  const n=Math.max(a.length,b.length,2);
  const mx=Math.max(...all,7), mn=Math.min(...all,-7);
  const x=(i,len)=>padL+i*(W-padL-padR)/Math.max(len-1,1);
  const y=(v)=>padT+(mx-v)*(H-padT-padB)/((mx-mn)||1);
  const path=(arr)=>arr.map((v,i)=>(i?'L':'M')+x(i,arr.length)+' '+y(v)).join(' ');
  const zero=y(0);
  const gy=[mx,Math.round((mx+mn)/2),mn];
  let grids=gy.map((v,i)=>`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="${grid}" stroke-width="1" stroke-dasharray="${i===1?'none':'3 4'}" opacity="${i===1?.9:.5}"/>
    <text x="${padL-6}" y="${y(v)+3}" fill="${sub}" font-size="11" font-family="JetBrains Mono" text-anchor="end">${(v>0?'+':'')+v}</text>`).join('');
  let gx=Array.from({length:n},(_,i)=>`<text x="${x(i,n)}" y="${H-6}" fill="${sub}" font-size="10" font-family="Space Grotesk" text-anchor="middle">G${i+1}</text>`).join('');
  let bdots=b.map((v,i)=>`<circle cx="${x(i,b.length)}" cy="${y(v)}" r="3" fill="${panel}" stroke="${accB}" stroke-width="2"/>`).join('');
  let adots=a.map((v,i)=>`<circle cx="${x(i,a.length)}" cy="${y(v)}" r="3.5" fill="${accA}"/>`).join('');
  const area=a.length?path(a)+` L ${x(a.length-1,a.length)} ${zero} L ${x(0,a.length)} ${zero} Z`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;" preserveAspectRatio="none">
    ${grids}${gx}
    <path d="${area}" fill="${accA}" fill-opacity=".10"/>
    <path d="${path(b)}" fill="none" stroke="${accB}" stroke-width="2.5" stroke-dasharray="5 4" opacity=".9"/>
    <path d="${path(a)}" fill="none" stroke="${accA}" stroke-width="3"/>${bdots}${adots}</svg>`;
}

/* ---------- derived tables ---------- */
function predict(A,B){
  const spread=+(A.spPlus-B.spPlus).toFixed(1), favA=spread>=0, fav=favA?A:B, dog=favA?B:A, abs=Math.abs(spread);
  const pA=normCdf((A.spPlus-B.spPlus)/DATA.marginSd);
  const total=Math.round((A.ppg+B.oppPpg+B.ppg+A.oppPpg)/2);
  const favPts=Math.round(total/2+abs/2), dogPts=Math.round(total/2-abs/2);
  return {favAbbr:fav.abbr,favName:fav.name,favA,spreadDisp:abs<1?'PK':'-'+abs.toFixed(1),
    scoreDisp:`${fav.abbr} ${favPts}–${dogPts} ${dog.abbr}`, aWin:Math.round(pA*100), bWin:Math.round((1-pA)*100)};
}
function kpis(A,B){
  const rows=[
    {label:'SP+ Rating',a:A.spPlus,b:B.spPlus,hi:true,dec:1,sign:true},
    {label:'Points / Game',a:A.ppg,b:B.ppg,hi:true,dec:1},
    {label:'Points Allowed',a:A.oppPpg,b:B.oppPpg,hi:false,dec:1},
    {label:'EPA / Play',a:A.epaOff,b:B.epaOff,hi:true,dec:2}];
  return rows.map(r=>{const good=r.hi?r.a>r.b:r.a<r.b,diff=Math.abs(r.a-r.b);
    const f=v=>(r.sign&&v>=0?'+':'')+v.toFixed(r.dec);
    return {label:r.label,aDisp:f(r.a),bDisp:f(r.b),deltaDisp:(good?'▲':'▼')+diff.toFixed(r.dec),deltaColor:good?GOOD:BAD};});
}
function ledger25(A,B){
  return [
    {label:'SP+ Rating',a:A.spPlus,b:B.spPlus,hi:true,dec:1,sign:true},
    {label:'Points / Game',a:A.ppg,b:B.ppg,hi:true,dec:1},
    {label:'Points Allowed',a:A.oppPpg,b:B.oppPpg,hi:false,dec:1},
    {label:'Yards / Game',a:A.ypg,b:B.ypg,hi:true,dec:0},
    {label:'Yards Allowed',a:A.oppYpg,b:B.oppYpg,hi:false,dec:0},
    {label:'EPA / Play (Off)',a:A.epaOff,b:B.epaOff,hi:true,dec:2,sign:true},
    {label:'EPA / Play (Def)',a:A.epaDef,b:B.epaDef,hi:false,dec:2,sign:true},
    {label:'Success Rate %',a:A.srOff,b:B.srOff,hi:true,dec:0,suf:'%'},
    {label:'Strength of Sched',a:A.sosRank,b:B.sosRank,hi:false,rank:true},
    {label:'Recruiting Rank',a:A.recruitRank,b:B.recruitRank,hi:false,rank:true},
    {label:'2026 Proj. Wins (preseason)',a:A.proj2026,b:B.proj2026,hi:true,dec:1}];
}
function ledger(rows){
  const neu='var(--text)';
  return rows.map(r=>{
    const na=r.a==null, nb=r.b==null;
    const f=(v,i)=> r.disp?r.disp[i]:(v==null?'—':(r.rank?'#'+v:((r.sign&&v>=0?'+':'')+(+v).toFixed(r.dec)+(r.suf||''))));
    const goodA=(na||nb)?false:(r.hi?r.a>=r.b:r.a<=r.b);
    let av,bv;
    if(na||nb){av=bv=1;} else if(r.rank){av=1/r.a;bv=1/r.b;} else {const off=Math.min(r.a,r.b)*0.6;av=Math.max(r.a-off,.01);bv=Math.max(r.b-off,.01);}
    const tot=av+bv;
    return {label:r.label,aDisp:f(r.a,0),bDisp:f(r.b,1),aColor:goodA?GOOD:neu,bColor:(!goodA&&!na&&!nb)?GOOD:neu,
      aBar:(av/tot*100).toFixed(1)+'%',bBar:(bv/tot*100).toFixed(1)+'%'};});
}
function effBars(A,B){
  const rows=[
    {label:'Off Success Rate',a:A.srOff,b:B.srOff,max:60,disp:Math.round(A.srOff)+'%'},
    {label:'Def Success Rate (allow)',a:100-A.srDef,b:100-B.srDef,max:60,disp:Math.round(A.srDef)+'%'},
    {label:'Off EPA/play',a:(A.epaOff*100),b:(B.epaOff*100),max:35,disp:A.epaOff.toFixed(2)},
    {label:'Explosiveness (pct)',a:A.radar.exp,b:B.radar.exp,max:100,disp:Math.round(A.radar.exp)}];
  return rows.map(r=>({label:r.label,aDisp:r.disp,
    aPct:Math.min(r.a/r.max*100,100).toFixed(0)+'%',bPct:Math.min(r.b/r.max*100,100).toFixed(0)+'%'}));
}

/* ---------- state ---------- */
const state={ a: DATA.teams[0].id, b: DATA.teams[3] ? DATA.teams[3].id : DATA.teams[1].id,
  mode:'overlay', season:'2025', conf:'all', q:'' };
const byId={}; DATA.teams.forEach(t=>byId[t.id]=t);
const CONFS=[...new Set(DATA.teams.map(t=>t.conference))].sort();
(function(){ // deep link: compare.html#a=<team id>&b=<team id>&season=2026&mode=side
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(h.get('a') && byId[h.get('a')]) state.a=h.get('a');
  if(h.get('b') && byId[h.get('b')]) state.b=h.get('b');
  if(h.get('season')==='2026') state.season='2026';
  if(h.get('mode')==='side') state.mode='side';
})();
function syncHash(){ const h=`a=${state.a}&b=${state.b}${state.season==='2026'?'&season=2026':''}${state.mode==='side'?'&mode=side':''}`;
  if(location.hash.replace(/^#/,'')!==h) history.replaceState(null,'','#'+h); }

/* ---------- 2026 season to date: the live scoreboard's data file (refreshed 3x/day in CI) ---------- */
let F=null, FT={}, FG=[], fStatus='loading';
fetch('forecast_data.json',{cache:'no-cache'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ F=d; FT={}; (d.teams||[]).forEach(t=>FT[t.team]=t); FG=d.games||[]; fStatus='ready'; })
  .catch(e=>{ fStatus='unavailable'; console.warn('2026 data unavailable:', e); })
  .then(()=>render());   // a render error must surface as an error, never as "offline"
const t26=t=>FT[t.name]||null;
const is26=()=>state.season==='2026' && fStatus==='ready';
function logistic(m){
  const c=(F&&F.inseason&&F.inseason.coefficients)||{'(Intercept)':0,'pred_margin':0.15};
  return 1/(1+Math.exp(-(c['(Intercept)']+c['pred_margin']*m)));
}
function games26(t){
  return FG.filter(g=>g.home===t.name||g.away===t.name).map(g=>{
    const home=g.home===t.name, opp=home?g.away:g.home, p=('pl' in g)?g.pl:g.p;
    const settled=('hw' in g), won=settled?(home?g.hw:!g.hw):null;
    const pf=settled?(home?g.hp:g.ap):null, pa=settled?(home?g.ap:g.hp):null;
    // where it is played, from this team's point of view
    const site=g.neutral?'vs':(g.host?(g.host===t.name?'vs':'at'):(home?'vs':'at'));
    return {id:g.id,wk:g.wk,date:g.date,opp,site,neutral:g.neutral,pTeam:home?p:1-p,settled,won,pf,pa,
      margin:settled?pf-pa:null,gone:!!g.gone};
  }).sort((x,y)=>x.date<y.date?-1:(x.date>y.date?1:0));
}
function meeting(A,B){
  return FG.find(g=>(g.home===A.name&&g.away===B.name)||(g.home===B.name&&g.away===A.name))||null;
}

/* ---------- 2026 derived ---------- */
function predict26(A,B){
  const a=t26(A), b=t26(B), m=a.rt-b.rt, pA=logistic(m), favA=m>=0, fav=favA?A:B, abs=Math.abs(m);
  return {favAbbr:fav.abbr,favName:fav.name,favA,spreadDisp:abs<0.5?'PK':'-'+abs.toFixed(1),
    aWin:Math.round(pA*100),bWin:Math.round((1-pA)*100)};
}
function kpis26(A,B){
  const a=t26(A), b=t26(B);
  const rows=[
    {label:'Rating (now)',a:a.rt,b:b.rt,hi:true,dec:1,sign:true},
    {label:'Proj. Wins (now)',a:a.pwl,b:b.pwl,hi:true,dec:1},
    {label:'Preseason Rating',a:a.rt0,b:b.rt0,hi:true,dec:1,sign:true},
    {label:'2026 Wins',a:a.aw,b:b.aw,hi:true,dec:0}];
  return rows.map(r=>{const good=r.hi?r.a>r.b:r.a<r.b,diff=Math.abs(r.a-r.b);
    const f=v=>(r.sign&&v>=0?'+':'')+(+v).toFixed(r.dec);
    return {label:r.label,aDisp:f(r.a),bDisp:f(r.b),deltaDisp:(good?'▲':'▼')+diff.toFixed(r.dec),deltaColor:good?GOOD:BAD};});
}
function ledger26(A,B){
  const a=t26(A), b=t26(B);
  return [
    {label:'Rating (now)',a:a.rt,b:b.rt,hi:true,dec:1,sign:true},
    {label:'Rating Rank',a:a.rk,b:b.rk,hi:false,rank:true},
    {label:'Preseason Rating',a:a.rt0,b:b.rt0,hi:true,dec:1,sign:true},
    {label:'2026 Record',a:a.aw-a.al,b:b.aw-b.al,hi:true,dec:0,disp:[`${a.aw}–${a.al}`,`${b.aw}–${b.al}`]},
    {label:'Proj. Wins (now)',a:a.pwl,b:b.pwl,hi:true,dec:1},
    {label:'Proj. Wins (preseason)',a:a.pw,b:b.pw,hi:true,dec:1},
    {label:'Games Left',a:a.left,b:b.left,hi:true,dec:0}];
}
function schedCard(t,acc){
  const gs=games26(t);
  const rows=gs.map(g=>{
    let res;
    if(g.gone) res=`<span class="res g" title="CFBD no longer lists this game">off sched</span>`;
    else if(g.settled) res=`<span class="res ${g.won?'w':'l'}">${g.won?'W':'L'} ${g.pf}–${g.pa}</span>`;
    else res=`<span class="res p" title="model win probability before kickoff">${Math.round(g.pTeam*100)}%</span>`;
    return `<div class="row"><span class="wk">WK ${g.wk}</span><span class="dt">${g.date.slice(5)}</span>
      <span class="opp"><span class="site">${g.site}</span> ${g.opp}${g.neutral?' <span class="site">(N)</span>':''}</span>${res}</div>`;
  }).join('');
  const f=t26(t);
  return `<div class="panel sched" style="background:linear-gradient(160deg,color-mix(in srgb,${acc} 16%,var(--panel)),var(--panel) 55%);padding:16px 18px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">${crest(t,30)}<span style="font:400 22px 'Anton';text-transform:uppercase;">${t.name}</span>
      <span style="margin-left:auto;font:700 13px 'JetBrains Mono';color:${acc};">${f.aw}–${f.al}</span></div>
    <div style="font:500 11px 'Space Grotesk';color:var(--sub);margin-bottom:4px;">${f.left} left · model probability shown for unplayed games</div>
    ${rows||'<div class="row">No FBS-vs-FBS games on the frozen schedule.</div>'}</div>`;
}

/* ---------- pickers ---------- */
function optionList(sel){
  const live=is26(), q=state.q.trim().toLowerCase();
  let ts=DATA.teams.filter(t=>t.id===sel ||
    ((state.conf==='all'||t.conference===state.conf) && (!q || t.name.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q))));
  if(live){ ts.sort((x,y)=>((t26(x)||{}).rk||999)-((t26(y)||{}).rk||999)); }
  else ts.sort((x,y)=>x.name.localeCompare(y.name));
  return ts.map(t=>{ const f=live?t26(t):null;
    const lab=f?`#${f.rk} ${t.name} (${f.aw}–${f.al})`:`${t.name}${t.spRank?' · SP+ #'+t.spRank:''}`;
    return `<option value="${t.id}"${t.id===sel?' selected':''}>${lab}</option>`; }).join('');
}
function refreshPickers(){
  const a=document.getElementById('selA'), b=document.getElementById('selB');
  if(a) a.innerHTML=optionList(state.a); if(b) b.innerHTML=optionList(state.b);
  const n=DATA.teams.filter(t=>(state.conf==='all'||t.conference===state.conf)&&(!state.q||t.name.toLowerCase().includes(state.q.toLowerCase()))).length;
  const c=document.getElementById('pickCount'); if(c) c.textContent=`${n} team${n===1?'':'s'}`;
}

/* ---------- render ---------- */
function render(){
  const A=byId[state.a], B=byId[state.b], side=state.mode==='side', live=is26();
  const a26=live?t26(A):null, b26=live?t26(B):null;
  let accA=accent(A), accB=accent(B); if(accB.toLowerCase()===accA.toLowerCase()) accB=B.secondary||'#8aa8c8';
  const aText=txtOn(accA), bText=txtOn(accB);
  const favColor = live ? (a26.rt>=b26.rt?'var(--a)':'var(--b)') : (A.spPlus>=B.spPlus?'var(--a)':'var(--b)');
  const vars=`--a:${accA};--a2:color-mix(in srgb,${accA} 55%,#06070a);--aText:${aText};--b:${accB};--bText:${bText};
    --favColor:${favColor};--text:#f3f6fb;--sub:#8a96a8;--border:rgba(255,255,255,.09);--panel:#12151d;--panel2:#0c0e14;--good:#3ddc84;`;
  const pred=live?predict26(A,B):predict(A,B), K=live?kpis26(A,B):kpis(A,B), E=effBars(A,B);
  const L=ledger(live?ledger26(A,B).concat(ledger25(A,B).map(r=>({...r,label:r.label+' · 2025'}))):ledger25(A,B));
  const chip=(txt,solid,col)=>`<span style="white-space:nowrap;font:700 13px 'Saira Condensed';letter-spacing:.06em;padding:5px 11px;border-radius:999px;${solid?`background:${col};color:${col===accA?aText:bText};`:'background:var(--panel2);border:1px solid var(--border);'}">${txt}</span>`;
  const rankDisp=t=>t.spRank?('SP+ #'+t.spRank):'NR';
  const rtg=v=>(v>=0?'+':'')+v.toFixed(1);
  const heroChips=(t,f,acc)=> live
    ? chip(`${f.aw}–${f.al}`,true,acc)+chip('Rating #'+f.rk,false)+chip('RTG '+rtg(f.rt),false)
    : chip(t.record,true,acc)+chip(rankDisp(t),false)+chip('SP+ '+rtg(t.spPlus),false);
  const meet=live?meeting(A,B):null;
  const meetHtml=(()=>{ if(!meet) return '';
    const aHome=meet.home===A.name, p=('pl' in meet)?meet.pl:meet.p, pA=aHome?p:1-p;
    const where=meet.neutral?'neutral site':('at '+(meet.host||meet.home));
    const played=('hw' in meet);
    const res=played?`<b>${meet.hw?meet.home:meet.away}</b> won ${Math.max(meet.hp,meet.ap)}–${Math.min(meet.hp,meet.ap)}`:`model: <b>${A.abbr} ${Math.round(pA*100)}%</b> · ${B.abbr} ${Math.round((1-pA)*100)}%`;
    return `<div class="meet">📅 They meet in 2026 — <b>Week ${meet.wk} · ${meet.date}</b> · ${where}. ${res}</div>`; })();
  const leaderCard=(t,acc)=>`<div class="panel" style="background:linear-gradient(160deg,color-mix(in srgb,${acc} 16%,var(--panel)),var(--panel) 55%);padding:16px 18px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">${crest(t,30)}<span style="font:400 22px 'Anton';text-transform:uppercase;">${t.name}</span></div>
      ${[['PASSING',t.leaders.pass],['RUSHING',t.leaders.rush],['RECEIVING',t.leaders.rec]].map(([role,l])=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border);">
          <span style="font:700 11px 'Space Grotesk';letter-spacing:.06em;color:${acc};width:78px;flex-shrink:0;">${role}</span>
          <div style="flex:1;min-width:0;"><div style="font:700 16px 'Saira Condensed';">${l[0]}</div>
          <div style="font:500 12px 'JetBrains Mono';color:var(--sub);">${l[1]}</div></div></div>`).join('')}</div>`;
  const btn26=fStatus==='ready'?'2026 season':(fStatus==='loading'?'2026 · loading…':'2026 · offline');
  const trendA=live?games26(A).filter(g=>g.settled).map(g=>g.margin):(A.margins||[]);
  const trendB=live?games26(B).filter(g=>g.settled).map(g=>g.margin):(B.margins||[]);
  const gA=live?a26.pwl:A.proj2026, gB=live?b26.pwl:B.proj2026;
  const builtAt=(F&&F.built_at)?F.built_at.replace('T',' ').slice(0,16)+' UTC':'';

  const app=document.getElementById('app');
  app.style.cssText=`${vars}min-height:100vh;background:radial-gradient(140% 60% at 50% 0%,color-mix(in srgb,var(--a) 20%,#06070a) 0%,#06070a 52%);color:var(--text);padding-bottom:60px;animation:cfbrise .4s ease;`;
  app.innerHTML=`
  <!-- control bar -->
  <div style="position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(8,9,13,.82);border-bottom:1px solid var(--border);">
    <div class="wrap" style="display:flex;align-items:center;gap:14px;padding:12px 26px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:9px;">
        <span style="width:9px;height:26px;border-radius:3px;background:linear-gradient(var(--a),var(--a2));"></span>
        <span style="font:800 15px 'Saira Condensed';letter-spacing:.14em;">GRIDIRON<span style="color:var(--a);">IQ</span></span>
        <span style="font:600 10px 'Space Grotesk';letter-spacing:.16em;color:var(--sub);padding-left:6px;">${live?'2026 SEASON TO DATE':DATA.season+' SEASON'}</span>
      </div>
      <div style="display:flex;gap:2px;flex-wrap:wrap;">
        <a href="forecast.html" style="font:600 12px 'Space Grotesk';color:var(--sub);padding:7px 11px;border-radius:8px;text-decoration:none;">2026 Forecast</a>
        <a href="glossary.html" style="font:600 12px 'Space Grotesk';color:var(--sub);padding:7px 11px;border-radius:8px;text-decoration:none;">Stat Guide</a>
        <a href="models.html" style="font:600 12px 'Space Grotesk';color:var(--sub);padding:7px 11px;border-radius:8px;text-decoration:none;">The Models</a>
      </div>
      <div style="flex:1;"></div>
      <div class="tog" title="${fStatus==='unavailable'?'2026 data is loaded from forecast_data.json (needs the site, not a local file)':'Which season the comparison is about'}">
        <button id="s25" class="${live?'':'on'}">2025 season</button>
        <button id="s26" class="${live?'on':''}" ${fStatus!=='ready'?'disabled':''}>${btn26}</button>
      </div>
      <div class="tog">
        <button id="mOverlay" class="${side?'':'on'}">Overlay</button>
        <button id="mSide" class="${side?'on':''}">Side&#8202;by&#8202;side</button>
      </div>
    </div>
    <div class="wrap" style="display:flex;align-items:center;gap:10px;padding:0 26px 12px;flex-wrap:wrap;">
      <div class="pickers">
        <input id="teamQ" type="text" placeholder="Find a team…" value="${state.q.replace(/"/g,'&quot;')}" autocomplete="off">
        <select id="confSel" class="conf"><option value="all"${state.conf==='all'?' selected':''}>All conferences</option>${CONFS.map(c=>`<option value="${c}"${state.conf===c?' selected':''}>${c}</option>`).join('')}</select>
        <span id="pickCount" style="font:600 11px 'JetBrains Mono';color:var(--sub);"></span>
      </div>
      <div style="flex:1;"></div>
      <div class="pickers">
        <span style="width:11px;height:11px;border-radius:3px;background:var(--a);"></span>
        <select id="selA" style="border:1px solid var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);">${optionList(state.a)}</select>
        <button id="swap" class="swap" title="Swap teams">⇄</button>
        <select id="selB" style="border:1px solid var(--b);background:color-mix(in srgb,var(--b) 14%,transparent);">${optionList(state.b)}</select>
        <span style="width:11px;height:11px;border-radius:3px;background:var(--b);"></span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <!-- hero -->
    <div class="hero" style="display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:26px;">
      <div style="position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--border);background:linear-gradient(115deg,color-mix(in srgb,var(--a) 32%,var(--panel)) 0%,var(--panel) 58%);padding:22px 24px;">
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(118deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px);"></div>
        <div style="position:relative;display:flex;align-items:center;gap:20px;">${crest(A,78)}
          <div style="min-width:0;">
            <div style="font:600 12px 'Space Grotesk';letter-spacing:.2em;color:var(--a);text-transform:uppercase;">${A.conference}</div>
            <div style="font:400 clamp(34px,5vw,60px)/.86 'Anton';text-transform:uppercase;margin-top:5px;">${A.name}</div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">${heroChips(A,a26,accA)}</div>
          </div></div>
      </div>
      <div style="position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--border);background:${side?'linear-gradient(245deg,color-mix(in srgb,var(--b) 32%,var(--panel)) 0%,var(--panel) 58%)':'var(--panel)'};padding:20px 22px;display:flex;flex-direction:column;justify-content:center;">
        ${side?`<div style="display:flex;align-items:center;gap:16px;">${crest(B,64)}
            <div style="min-width:0;"><div style="font:600 12px 'Space Grotesk';letter-spacing:.2em;color:var(--b);text-transform:uppercase;">${B.conference}</div>
            <div style="font:400 clamp(28px,4vw,48px)/.86 'Anton';text-transform:uppercase;margin-top:5px;">${B.name}</div>
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${heroChips(B,b26,accB)}</div></div></div>${meetHtml}`
        :`<div><div style="font:600 11px 'Space Grotesk';letter-spacing:.16em;color:var(--sub);">${live?'IN-SEASON MODEL · NEUTRAL FIELD · RATINGS NOW':'MODEL PROJECTION · NEUTRAL FIELD'}</div>
            <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px;">
              <span style="font:400 46px/1 'Anton';color:var(--favColor);">${pred.favAbbr}</span>
              <span style="font:800 40px 'Saira Condensed';">${pred.spreadDisp}</span></div>
            <div style="font:500 13px 'Space Grotesk';color:var(--sub);margin-top:4px;">${live?`${pred.favName} favored by the current ratings`:`Projected ${pred.scoreDisp} · ${pred.favName} favored`}</div>
            <div style="display:flex;gap:18px;margin-top:14px;">
              <div><div style="font:800 24px 'Saira Condensed';color:var(--a);">${pred.aWin}%</div><div style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);">${A.abbr} WIN</div></div>
              <div><div style="font:800 24px 'Saira Condensed';color:var(--b);">${pred.bWin}%</div><div style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);">${B.abbr} WIN</div></div></div>${meetHtml}</div>`}
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpis" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px;">
      ${K.map(m=>`<div class="panel" style="padding:16px 18px;position:relative;overflow:hidden;">
        <div style="position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a) 20%,transparent));"></div>
        <div style="font:600 11px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);text-transform:uppercase;">${m.label}</div>
        <div style="display:flex;align-items:baseline;gap:9px;margin-top:10px;"><span style="font:800 34px/1 'Saira Condensed';">${m.aDisp}</span><span style="font:700 13px 'JetBrains Mono';color:${m.deltaColor};">${m.deltaDisp}</span></div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:9px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--b);"></span><span style="font:500 12px 'JetBrains Mono';color:var(--sub);">${B.abbr} ${m.bDisp}</span></div></div>`).join('')}
    </div>

    ${live?`
    <!-- 2026 schedule & results -->
    <div class="sec"><h2>2026 Schedule &amp; Results</h2><span class="line"></span><span class="hint">SEASON TO DATE · UPDATED ${builtAt}</span></div>
    <div class="players" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">${schedCard(A,accA)}${schedCard(B,accB)}</div>`:''}

    <!-- overview trio -->
    <div class="sec"><h2>Overview</h2><span class="line"></span><span class="hint">${live?'2026 PROJECTION (NOW) · 2025 PROFILE · 2025 EFFICIENCY':'2026 PROJECTION · PROFILE · EFFICIENCY'}</span></div>
    <div class="trio" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
      <div class="panel" style="padding:16px 18px;display:flex;flex-direction:column;">
        <div style="font:600 12px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);">${live?'2026 WIN PROJECTION · NOW':'2026 WIN PROJECTION'}</div>
        <div style="flex:1;display:flex;align-items:center;">${gauge(gA,gB,accA,accB,live?'2026 PROJ. WINS · NOW':'2026 PROJ. WINS')}</div>
        <div style="display:flex;justify-content:center;gap:16px;"><span style="font:500 11px 'Space Grotesk';color:var(--a);">● ${A.abbr} ${gA!=null?gA.toFixed(1):'—'}</span><span style="font:500 11px 'Space Grotesk';color:var(--b);">○ ${B.abbr} ${gB!=null?gB.toFixed(1):'—'}</span></div>
        ${live?`<div style="text-align:center;font:500 11px 'Space Grotesk';color:var(--sub);margin-top:6px;">preseason: ${A.abbr} ${a26.pw.toFixed(1)} · ${B.abbr} ${b26.pw.toFixed(1)}</div>`:''}
      </div>
      <div class="panel" style="padding:16px 18px;"><div style="font:600 12px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);">TEAM PROFILE${live?' · 2025':''}</div>${radar(A,B,accA,accB)}</div>
      <div class="panel" style="padding:16px 18px;"><div style="font:600 12px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);margin-bottom:8px;">EFFICIENCY SPLIT${live?' · 2025':''}</div>
        ${E.map(e=>`<div style="margin-bottom:11px;"><div style="display:flex;justify-content:space-between;font:500 11px 'Space Grotesk';color:var(--sub);margin-bottom:4px;"><span>${e.label}</span><span style="font-family:'JetBrains Mono';color:var(--text);">${e.aDisp}</span></div>
          <div style="position:relative;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;"><div style="position:absolute;left:0;top:0;height:100%;width:${e.bPct};background:var(--b);opacity:.5;border-radius:4px;"></div><div style="position:absolute;left:0;top:0;height:100%;width:${e.aPct};background:var(--a);border-radius:4px;"></div></div></div>`).join('')}</div>
    </div>

    <!-- trend -->
    <div class="sec"><h2>Scoring Margin Trend</h2><span class="line"></span><span class="hint">POINT DIFFERENTIAL · BY GAME${live?' · 2026':''}</span></div>
    <div class="panel" style="padding:20px 22px;">
      <div style="display:flex;gap:20px;margin-bottom:6px;"><span style="font:600 12px 'Space Grotesk';color:var(--a);">■ ${A.name}</span><span style="font:600 12px 'Space Grotesk';color:var(--b);">■ ${B.name}</span></div>
      ${(trendA.length||trendB.length)?trend(trendA,trendB,accA,accB):'<div style="font:500 13px \'Space Grotesk\';color:var(--sub);padding:20px 0;text-align:center;">No settled games yet.</div>'}</div>

    <!-- ledger -->
    <div class="sec"><h2>Season Ledger</h2><span class="line"></span><span class="hint">${live?'2026 TO DATE · THEN THE 2025 BASELINE':'HEAD-TO-HEAD · ADVANCED + TRADITIONAL'}</span></div>
    <div class="panel" style="overflow:hidden;">
      <div style="display:grid;grid-template-columns:1.6fr 1fr 2.2fr 1fr;padding:11px 20px;border-bottom:1px solid var(--border);background:var(--panel2);">
        <span style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);">METRIC</span>
        <span style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--a);text-align:right;">${A.abbr}</span>
        <span style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--sub);text-align:center;">COMPARISON</span>
        <span style="font:600 10px 'Space Grotesk';letter-spacing:.1em;color:var(--b);text-align:left;padding-left:14px;">${B.abbr}</span>
      </div>
      ${L.map(r=>`<div style="display:grid;grid-template-columns:1.6fr 1fr 2.2fr 1fr;align-items:center;padding:11px 20px;border-bottom:1px solid var(--border);">
        <span style="font:500 13px 'Space Grotesk';">${r.label}</span>
        <span style="font:700 15px 'JetBrains Mono';color:${r.aColor};text-align:right;padding-right:10px;">${r.aDisp}</span>
        <div style="display:flex;align-items:center;gap:3px;"><div style="flex:1;display:flex;justify-content:flex-end;"><div style="height:9px;width:${r.aBar};background:var(--a);border-radius:3px 0 0 3px;"></div></div>
          <div style="width:1px;height:14px;background:var(--sub);"></div>
          <div style="flex:1;display:flex;justify-content:flex-start;"><div style="height:9px;width:${r.bBar};background:var(--b);border-radius:0 3px 3px 0;"></div></div></div>
        <span style="font:700 15px 'JetBrains Mono';color:${r.bColor};text-align:left;padding-left:14px;">${r.bDisp}</span></div>`).join('')}
    </div>

    <!-- players -->
    <div class="sec"><h2>Player Leaders</h2><span class="line"></span><span class="hint">PASSING · RUSHING · RECEIVING${live?' · 2025':''}</span></div>
    <div class="players" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">${leaderCard(A,accA)}${leaderCard(B,accB)}</div>

    <div style="margin-top:34px;font:500 12px 'Space Grotesk';color:var(--sub);line-height:1.7;">
      ${live?`<b style="color:var(--text);font-weight:600;">2026 season to date</b> — record, in-season rating, projections and schedule come from the live
      <a href="forecast.html" style="color:var(--a);">forecast scoreboard</a> (refreshed three times a day; this copy built ${builtAt}); the matchup projection uses the in-season model's
      current ratings on a neutral field. SP+, EPA, efficiency, profile and player leaders are the ${DATA.season} baseline.`
      :`${DATA.season} FBS season. SP+, EPA &amp; efficiency from the <a href="https://github.com/Steve27M/cfb-analytics" style="color:var(--a);">cfb-analytics</a> warehouse;
      neutral-field projection uses the SP+ margin + the project's win model; 2026 win totals are the project's preseason forecast.`}
      Data: CollegeFootballData.com. Team names &amp; logos are the property of their respective institutions.
    </div>
  </div>`;

  refreshPickers(); syncHash();
  document.getElementById('selA').onchange=e=>{state.a=e.target.value;render();};
  document.getElementById('selB').onchange=e=>{state.b=e.target.value;render();};
  document.getElementById('swap').onclick=()=>{[state.a,state.b]=[state.b,state.a];render();};
  document.getElementById('confSel').onchange=e=>{state.conf=e.target.value;refreshPickers();};
  document.getElementById('teamQ').oninput=e=>{state.q=e.target.value;refreshPickers();};
  document.getElementById('mOverlay').onclick=()=>{state.mode='overlay';render();};
  document.getElementById('mSide').onclick=()=>{state.mode='side';render();};
  document.getElementById('s25').onclick=()=>{state.season='2025';render();};
  document.getElementById('s26').onclick=()=>{if(fStatus==='ready'){state.season='2026';render();}};
}
render();
</script>
</body>
</html>
