# Scoreboard refresh: let the sealed in-season model take a new snapshot when results have
# settled, score every frozen forecast version against those results and republish
# docs/forecast.html. One CFBD API call per run (polite UA), daily during the
# three times a day in season (Aug-Dec) — ~90 calls/month against the 1,000/month free-tier quota. This is the
# project's only scheduled collection; the warehouse/model pipeline stays on-demand.
# Once the last predicted game settles, the page stops changing and commits stop naturally.
name: score

on:
  schedule:
    - cron: "20 3,9,15 * 8-12 *"   # 03:20/09:20/15:20 UTC daily Aug-Dec: late Saturday night US,
                                   # early morning (after the West-coast finals), and a late-morning
                                   # catch-up — GitHub often starts scheduled runs 3-5 h late
  workflow_dispatch: {}

concurrency:
  group: score
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the forecast scoreboard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: uv run python dashboard/build_forecast.py

      - name: Commit the refreshed page + any new snapshot (only if something changed)
        run: |
          if [ -z "$(git status --porcelain -- docs/forecast.html predictions/)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name "gridironiq-bot"
          git config user.email "gridironiq-bot@users.noreply.github.com"
          git add docs/forecast.html predictions/
          if git status --porcelain -- predictions/ | grep -q .; then
            git commit -m "score: in-season snapshot + scoreboard refresh $(date -u +%F)"
          else
            git commit -m "score: scoreboard refresh $(date -u +%F)"
          fi
          git push
